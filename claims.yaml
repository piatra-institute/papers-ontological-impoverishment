- id: abs-definition
  kind: definition
  passage: This paper asks which ways of being embodied a person can reach, and defines ontological impoverishment as their foreclosure by arrangements for which a feasible, justifiable alternative exists.
  rationale: Working definition of the paper's central term; developed formally in the section on reachable embodiments.
- id: kieliba-training
  kind: source
  passage: Able-bodied volunteers in a study published in 2021 were trained to use an extra robotic thumb over 5 days, in the laboratory and in unstructured daily use.
  evidence:
    citation_id: kieliba2021
    locator: Abstract
    verified: true
    verification_note: 'Read the abstract (Europe PMC record PMID 34043536): able-bodied participants trained to use an extra robotic thumb over 5 days including lab-based and unstructured daily use. Full text not retrieved (Europe PMC returned an error for PMC7612043). Independent check (gemini-4-hydrogen-xhigh, 2026-11-26, fulltext): Inspected Europe PMC/OpenAlex abstract and NCBI PMC fulltext XML (PMC7612043); confirms able-bodied participants trained with the Third Thumb over 5 days including lab-based and unstructured daily use.'
    depth: abstract
    quote: Able-bodied participants were trained to use an extra robotic thumb (called the Third Thumb) over 5 days, including both lab-based and unstructured daily use.
- id: kieliba-results
  kind: source
  passage: Their control of the device and their hand-robot coordination improved, they reported an increased sense of embodiment over the thumb, and the representation of their biological hand changed [@kieliba2021].
  evidence:
    citation_id: kieliba2021
    locator: Abstract
    verified: true
    verification_note: 'Abstract reports improved Third Thumb motor control, dexterity and hand-robot coordination, increased sense of embodiment, and changes to the biological hand representation. Independent check (gemini-4-hydrogen-xhigh, 2026-11-26, fulltext): Inspected Europe PMC/OpenAlex abstract and NCBI PMC fulltext XML (PMC7612043); confirms improved motor control and hand-robot coordination, increased sense of embodiment, and biological hand representation changes (weakened kinematic synergies and mild fMRI motor-representation collapse).'
    depth: abstract
    quote: Training improved Third Thumb motor control, dexterity, and hand-robot coordination, even when cognitive load was increased or when vision was occluded. It also resulted in increased sense of embodiment over the Third Thumb.
- id: money-partial
  kind: interpretation
  passage: 'Consider what stands between a particular person and living with such a thumb for years. Four different things can. The organization must be possible, given physics and the materials involved. A route must exist from where the person is now: someone must have built, fitted and calibrated the device, and a procedure must exist for doing so. The person must be able to learn to inhabit the new arrangement and keep it working, which takes training, maintenance and repair. And the person must be permitted and able to obtain it on terms that leave its purposes in their hands: law, clinical classification, price, a provider''s power to switch the device off and an employer''s power to require it all bear on this last condition. Money addresses part of the last obstacle and none of the others.'
  rationale: 'Follows from the four-obstacle decomposition: income bears on the price component of access and on purchasable support only; formalised as Proposition 1.'
- id: more-definition
  kind: source
  passage: The phrase "morphological freedom" first appears, as far as the published record shows, in Max More's 1993 essay on technological self-transformation, which defines it in a glossary as "the ability to alter bodily form at will through technologies such as surgery, genetic engineering, nanotechnology, uploading" [@more1993].
  evidence:
    citation_id: more1993
    locator: Definitions glossary at the end of the essay
    verified: true
    verification_note: 'Read the author''s archived web copy (Wayback snapshot 2006-01-16 of maxmore.com/selftrns.htm), which states it was originally published in Extropy #10 (4:2), Winter/Spring 1993. Glossary entry quoted verbatim. ''First appears'' is a claim about the published record as far as this search found; not independently established. Independent check (gemini-4-hydrogen-xhigh, 2026-11-26, fulltext): Inspected Wayback 2006-01-16 snapshot of maxmore.com/selftrns.htm; glossary defines morphological freedom verbatim and notes Extropy #10 (4:2), Winter/Spring 1993 publication. The hedged ''as far as the published record shows'' priority qualifier was not independently exhausted against pre-1993 archives.'
    depth: fulltext
    quote: 'Morphological freedom: The ability to alter bodily form at will through technologies such as surgery, genetic engineering, nanotechnology, uploading.'
- id: sandberg-right
  kind: source
  passage: 'Anders Sandberg''s 2001 talk, later published as a book chapter, recast the concept as a right: "an extension of one''s right to one''s body, not just self-ownership but also the right to modify oneself according to one''s desires" [@sandberg2001; @sandberg2013].'
  evidence:
    citation_id: sandberg2001
    locator: Section 'Morphological Freedom as a Right'
    verified: true
    verification_note: "Read the talk text via Wayback snapshot 2013-03-09 of aleph.se/Nada/Texts/MorphologicalFreedom.htm. The 2013 chapter (DOI 10.1002/9781118555927.ch5) was identity-checked only; its wording was not compared. Independent check (gemini-4-hydrogen-xhigh, 2026-11-26, fulltext): Inspected Wayback 2013-03-09 snapshot of aleph.se/Nada/Texts/MorphologicalFreedom.htm; confirms the quoted definition verbatim under 'Morphological Freedom as a Right'. sandberg2013 was checked at identity depth via Crossref (10.1002/9781118555927.ch5)."
    depth: fulltext
    quote: What is morphological freedom? I would view it as an extension of one's right to one's body, not just self-ownership but also the right to modify oneself according to one's desires.
- id: sandberg-negative
  kind: source
  passage: Sandberg states that morphological freedom "is, like the others, a negative right" that "does not in itself imply others are morally obliged to support exercise of it" [@sandberg2001].
  evidence:
    citation_id: sandberg2001
    locator: Section 'Morphological Freedom as a Right'
    verified: true
    verification_note: 'Read the archived talk text; quoted phrases appear verbatim. Independent check (gemini-4-hydrogen-xhigh, 2026-11-26, fulltext): Inspected Wayback 2013-03-09 snapshot of aleph.se/Nada/Texts/MorphologicalFreedom.htm; both quoted phrases appear verbatim.'
    depth: fulltext
