- id: construct-scope
  kind: interpretation
  passage: The survey items measure excitement about specific techniques, led by disease prevention, and preferences about regulation, among U.S. adults grouped by party identification.
  rationale: 'Restates the construct measured, after review: excitement about six techniques and regulation preferences, by party identification.'
- id: provocation-verdict
  kind: interpretation
  passage: In these bivariate tables, Democrats and leaners were the more excited group on every item reported by party, which contradicts the hypothesis at that scale. The party difference in the expected direction concerns regulation, and it is not specific to bodily technologies. The hypothesis conflates two dimensions, enthusiasm for transformation and preferences about its governance.
  rationale: 'Descriptive, unadjusted verdict scoped to the survey construct: all six party gaps favour Democrats; the regulation gap also appears for non-bodily technologies.'
- id: joint-model
  kind: interpretation
  passage: A survey-weighted model of the 2021 respondent-level data with ideology and demographic controls would show how much of the party difference survives adjustment; those data require a Pew account and were not used here.
  rationale: Names the adjusted analysis that would test whether the party difference survives controls, and why it was not done (Pew account required).
