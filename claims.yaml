- id: disability-accommodation
  kind: interpretation
  passage: The reachable set accommodates these arguments and is constrained by them. A misfit can be removed by changing the world, which enlarges $L_i$ and $A_i$ for the present embodiment; the structure does not privilege changing the body. The current embodiment belongs to the evaluated set by definition, so pressure to modify counts as impoverishment. And reachable sets are compared by inclusion, never by distance from a statistical norm.
  rationale: 'Shows how the structure answers the disability critique: world-change enlarges L and A; current embodiment is in the evaluated set; comparison is by inclusion.'
