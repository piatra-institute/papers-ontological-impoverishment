- id: poverty-contrast
  kind: interpretation
  passage: Ontological impoverishment, as defined above, is exactly the graded, contingent narrowing of range that Heidegger excluded from his notion.
  rationale: The contrast follows from Heidegger's quoted exclusion of quantitative distinctions in range.
- id: enframing-indicator
  kind: interpretation
  passage: An exoskeleton issued and configured by an employer to raise lifting output may enlarge a worker's physical repertoire while keeping its purposes in someone else's hands. Under the definition, such an embodiment is not accessible to the worker in the relevant sense, because the condition on $A_i$ requires that its purposes remain under the person's control. The danger becomes an indicator of who sets purposes and who can revoke function. It does not become a reason to refuse transformation as such.
  rationale: Translation of the Heideggerian objection into a component of the access layer; the essay is cited at identity level.
- id: lived-integration-evidence
  kind: interpretation
  passage: Incorporation changes the field of what can be perceived and done. The robotic-thumb study gives this an experimental counterpart, with measured changes in control, reported embodiment and hand representation after training [@kieliba2021]. Lived integration is therefore a layer with its own measurements.
  rationale: Rests on the robotic-thumb abstract and on Merleau-Ponty's well-known analysis of incorporated instruments (identity level, no locator).
