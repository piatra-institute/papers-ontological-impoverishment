- id: addition-transitions
  kind: interpretation
  passage: 'What the capability literature does not supply is an explicit account of transitions between embodiments: whether a known procedure leads from a person''s present organization to another, whether every intermediate state can be lived through, and how research institutions change the set of procedures over time. The structure below adds these three elements and compares reachable sets by inclusion, without counting options.'
  rationale: 'States the paper''s addition relative to capability theory, narrowed after review: routes, intermediate states and research-dependent route sets; comparison by inclusion avoids the cardinality ranking.'
- id: openalex-search
  kind: interpretation
  passage: A search of the OpenAlex index for the exact phrase "ontological impoverishment" found incidental uses and no definition of the term for embodiment; the novelty claimed here is the defined structure, not the phrase.
  rationale: Search performed 2026-11-25 against api.openalex.org with the quoted phrase; 12 top results inspected by title and venue (theology, aesthetics, philosophy of science); none defines the term for embodiment. Not an exhaustive search.
- id: def-embodiment
  kind: definition
  passage: 'Let $\mathcal{E}$ be a space of embodiments. An embodiment $e \in \mathcal{E}$ describes a bodily organization together with its stable technical couplings, at the grain that matters for what a person can perceive, do and undergo: sensory channels, effectors, physiological regulation, and the devices or tissues incorporated into them.'
  rationale: Defines the state space; grain is chosen by relevance to perception, action and undergoing.
- id: def-route
  kind: definition
  passage: 'A route is a transition $x \to y$ between embodiments that some procedure known at $t$ can realise: a surgery, a fitting, a pharmacological regimen, a training programme or a developmental intervention.'
  rationale: Defines routes as transitions realisable by procedures known at t.
- id: def-reachable
  kind: definition
  passage: 'The reachable set of person $i$ has two parts. Remaining is available when the current embodiment is itself possible, livable and accessible. A different embodiment is reachable when a chain of known routes leads to it and every state after the start is possible, livable and accessible: $$\begin{aligned} R_i^{\mathrm{stay}} &= \{ e_i(t) \} \ \text{if}\ e_i(t) \in P \cap L_i(S) \cap A_i(I), \ \text{and}\ \varnothing \ \text{otherwise}; \\ R_i^{\mathrm{move}} &= \{\, e : \exists\, x_0 = e_i(t), x_1, \ldots, x_k = e,\ k \ge 1,\ x_{j-1} \to x_j \in \mathcal{T}(t), \\ &\qquad x_j \in P \cap L_i(S) \cap A_i(I)\ \text{for}\ 1 \le j \le k \,\}; \\ R_i(t; S, I) &= R_i^{\mathrm{stay}} \cup R_i^{\mathrm{move}}. \end{aligned}$$'
  rationale: 'Revised after review: remaining requires the current embodiment to satisfy the state constraints; moves require every state after the start to satisfy them, so an unsupported or coerced starting state does not empty the reachable set.'
- id: def-remain
  kind: definition
  passage: The starting state need not satisfy the constraints for a move, so a person whose present embodiment is unsupported, or who is under pressure, can still reach a supported alternative. Losing support for the body one has, or being pressured to change it, removes $e_i(t)$ from $R_i$. The freedom to remain is thus part of the same structure as the freedom to change.
  rationale: 'Consequence of the two-part definition: the freedom to remain is the stay component.'
- id: def-admissible
  kind: definition
  passage: An arrangement is admissible when the society could provide it with the resources and knowledge available at $t$ at comparable total cost, and when its restrictions and burdens on others could be justified to everyone affected.
  rationale: Admissibility combines feasibility at comparable cost with a justification filter, aligning the formal definition with the informal one.
- id: def-justification
  kind: normative
  passage: 'The second condition is a normative filter, like $V_i$: restrictions that protect third parties, or that reflect defensible priorities among scarce resources, do not count as impoverishment, and an arrangement that requires resources the society lacks is outside $\mathbb{F}$.'
  rationale: 'Normative input: justified restrictions and resource priorities are excluded from impoverishment.'
- id: def-impoverishment
  kind: definition
  passage: An embodiment belongs to $O_i(t)$ when the person has reason to value it, or currently has it, and some admissible arrangement of support and institutions would make it reachable while the actual arrangement does not.
  rationale: Verbal statement of the formal definition of ontological impoverishment as a set difference relative to feasible arrangements.
- id: def-exclusions
  kind: definition
  passage: Three exclusions follow from the definition and keep the concept from absorbing every unmet wish. An embodiment outside $P$ is a natural limit, burdensome perhaps but nobody's foreclosure. An embodiment inside $P$ with no chain of known routes at $t$ is a frontier limit at $t$. An embodiment the person has no reason to value does not count, which prevents the concept from ranking lives by the size of an inventory of imaginable bodies.
  rationale: Natural limits, frontier limits and unvalued embodiments are excluded by construction.
- id: def-inquiry
  kind: definition
  passage: Routes are produced by inquiry, so the route set at a horizon $t + \Delta$ depends on research institutions, $\mathcal{T}(t + \Delta; I)$. Over that horizon, the embodiments that admissible research arrangements would bring into reach and actual arrangements would not form the person's impoverishment of inquiry.
  rationale: 'Dynamic counterpart over an explicit horizon: route sets depend on research institutions.'
- id: ontic-caution
  kind: interpretation
  passage: 'In Heidegger''s vocabulary, restrictions on particular bodily possibilities are ontic: they concern entities and their properties, not the structures of existence.'
  rationale: Reconstructive use of 'ontological'; the ontic/ontological distinction is standard in Being and Time (cited at identity level).
- id: assumption-income
  kind: assumption
  passage: '**Proposition 1 (income and reachable sets).** Suppose income enters the structure only through the price component of $A_i$ and through support in $S$ that must be purchased, and that institutions and known routes do not depend on the person''s income. (a) Within one institutional regime, $R_i$ is weakly increasing in income, and income cannot bring into $R_i$ an embodiment excluded by $P$, by the absence of a chain of known routes, or by a non-price component of $A_i$ along every chain. (b) Across regimes, income and reachable-set inclusion are independent orderings: a person with lower income can have a strictly larger reachable set.'
  rationale: Income acts only through price and purchased support, and institutions and routes are exogenous to the person's income; if income can buy a change of regime, part (b) weakens to the components income cannot reach, as the paper states.
- id: prop1
  kind: interpretation
  passage: '*Proof.* (a) Raising income relaxes only price and purchased support, so every chain admissible before remains admissible, and conditions that do not depend on income are unaffected. (b) Let $\mathcal{E} = \{e_0, e\}$, with $e_0$ the current embodiment of two persons, livable and accessible for both, and a known route $e_0 \to e$. Person 1 has income $y_1$ and lives under $I_1$, where the effector that defines $e$ is publicly provided with training and independent repair. Person 2 has income $y_2 > y_1$ and lives under $I_2$, where the device is sold only under a licence that lets the supplier disable it at will, which fails the non-price condition on $A_2$. Then $R_1 = \{e_0, e\}$ strictly contains $R_2 = \{e_0\}$ although $y_1 < y_2$. Exchanging the regimes gives the opposite strict inclusion, so neither ordering implies the other.'
  rationale: Proof of monotonicity within a regime and a strict income-reversal example across regimes.
- id: prop1-regime
  kind: interpretation
  passage: When income can buy a change of regime, for example through travel to a jurisdiction with different rules or a privately financed route, part (b) holds only for the components of access that income cannot reach.
  rationale: States the limit of part (b) when institutions are endogenous to income.
- id: prop2
  kind: interpretation
  passage: '**Proposition 2 (complementarity).** Relaxing one constraint enlarges $R_i$ only at embodiments for which the remaining constraints already hold along some chain. The effect of research funding, training support, legal permission or subsidy on $R_i$ therefore depends on the others, and an indicator confined to a single layer can register progress while $R_i$ is unchanged.'
  rationale: Follows because the reachable set is defined by a conjunction of conditions along chains.
- id: prop3
  kind: interpretation
  passage: '**Proposition 3 (path dependence).** Conditions on the endpoint are not sufficient. An embodiment $e$ can satisfy $e \in P \cap L_i \cap A_i$, with a chain of known routes leading to it, and still lie outside $R_i$ when every such chain passes through an intermediate state $x_j$, with $1 \le j < k$, outside $L_i \cap A_i$.'
  rationale: Follows because conditions apply to every state of a chain, not only its endpoint.
