abstract: This paper asks which ways of being embodied a person can reach, and defines ontological impoverishment
  as their foreclosure by arrangements for which a feasible, justifiable alternative exists. An embodiment
  is reachable when known routes lead to it through states that are physically possible, livable for the
  person with available support, and accessible on terms that leave its purposes under the person's control;
  remaining in the current embodiment is assessed separately. Three propositions follow. With institutions
  and routes fixed, income enlarges reachable sets only through price and purchased support, and across
  institutional regimes a poorer person can have the strictly larger set; relaxing one constraint helps
  only where the others already hold; and intermediate states of a transition count. The structure takes
  Heidegger's being-ahead-of-itself and thrownness and sets aside his non-quantitative notion of world-poverty.
  Experiments by Levin and colleagues on planarians, ectopic eyes, xenobots and anthrobots enlarge possibility
  and known routes, not access. The account separates More's original ability from Sandberg's negative
  right and locates xenofeminism's demands in the non-price conditions of access. Published Pew aggregates
  test one version of the claim that resistance to enhancement belongs to the political left. In unadjusted
  tables from November 2021, U.S. Democrats were more often excited than Republicans about all 6 techniques
  asked about, led by disease prevention, by 8 to 11 points, and more often feared under-regulation, as
  they did for non-bodily technologies. These descriptive attitudes do not measure commitment to morphological
  freedom.
