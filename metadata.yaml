web_blurb: Some people are poor in money; others are confined to the bodies and ways of living their institutions
  let them reach. The paper defines this ontological impoverishment as the avoidable foreclosure of reachable
  embodiments, separates what physics, known routes, lived support and access each contribute, and tests
  the claim that resistance to bodily enhancement belongs to the political left against published U.S.
  survey data, which do not bear it out.
